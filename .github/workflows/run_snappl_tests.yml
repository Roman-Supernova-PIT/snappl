name: Run SNAPPL Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: run snappl tests in docker container
    runs-on: ubuntu-latest

    steps:
      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v2

      - name: checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: run ruff
        uses: astral-sh/ruff-action@v3

      - name: checkout photometry test data
        run: |
          cd ..
          mkdir packages
          cd packages
          git clone http://github.com/Roman-Supernova-PIT/photometry_test_data

      # STPSF needs reference data that isn't in the docker image.  Pin the
      # data version to match the stpsf version in the environment
      # (requirements-cpu.txt: stpsf==2.2.0).  Don't use the stpsf-data-LATEST
      # link: as of 2.3.0 it has a layout that stpsf 2.2.0 can't read.
      # ../packages is bind-mounted at /packages in the shell container, so
      # the data ends up at /packages/stpsf-data (see STPSF_PATH below).
      - name: cache stpsf data
        id: cache-stpsf-data
        uses: actions/cache@v4
        with:
          path: ../packages/stpsf-data
          key: stpsf-data-2.2.0

      - name: download stpsf data
        if: steps.cache-stpsf-data.outputs.cache-hit != 'true'
        run: |
          cd ../packages
          curl -sSfL -o stpsf-data.tar.gz https://stsci.box.com/shared/static/mjst9j056ibf2uph4gxy8qxmi89tjzwk.gz
          tar xzf stpsf-data.tar.gz
          rm stpsf-data.tar.gz
          cat stpsf-data/version.txt
          test -f stpsf-data/WFI/WIM_F062_zernikes_cycle10.csv

      - name: log into github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: cleanup
        run: |
          # try to save HDD space on the runner by removing some unneeded stuff (~8GB)
          # ref: https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
          # (For some perverse reason, this step seems to take 1.5-2 minutes on github runners!
          # For that reason, this is commented out, for now.  Uncomment it if we run into trouble.)
          df -h
          # echo "------"
          # sudo rm -rf /usr/share/dotnet
          # sudo rm -rf /opt/ghc
          # sudo rm -rf "/usr/local/share/boost"
          # sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          # echo "------"
          # df -h

      - name: pull environment archive
        run: |
          cd ../packages
          git clone https://github.com/Roman-Supernova-PIT/environment.git

      - name: pull docker images
        run: |
          cd ../packages/environment/test-docker-environment
          docker compose pull mailhog postgres webserver shell

      - name: run test
        run: |
          # These actions start in the snappl checkout, so go up one to
          # get to where it was checked out
          cd ..
          # test environment expects then snappl checkout to be in the packages subdir
          mv snappl packages/
          cd packages
          #### CHICKEN AND EGG NOTE part 1
          # See part 2 below
          git clone https://github.com/Roman-Supernova-PIT/snappl_ou2024.git
          cd snappl_ou2024
          git checkout initialize
          cd ..
          git clone https://github.com/Roman-Supernova-PIT/snappl_imagesimulator.git
          cd snappl_imagesimulator
          git checkout initialize
          cd ..
          #### END OF CHICKEN AND EGG NOTE part 1
          cd environment/test-docker-environment
          docker compose up -d webserver shell
          #### CHICKEN AND EGG NOTE part 2
          # Eventually, we should just let the .[test] install of snappl
          #   install a snappl_ou2024 package, but right now it's not on
          #   PyPi, as we're in the middle of the breakout.  Once both
          #   packages have been released on PyPi, we can change this.
          docker compose exec shell bash -c 'cd /packages/snappl && pip install -e .'
          docker compose exec shell bash -c 'cd /packages/snappl_ou2024 && pip install -e .'
          docker compose exec shell bash -c 'cd /packages/snappl_imagesimulator && pip install -e .'
          #### END OF CHICKEN AND EGG NOTE part 2
          docker compose exec shell bash -c 'cd /packages/snappl && pip install -e .[test]'
          docker compose exec -e STPSF_PATH=/packages/stpsf-data shell bash -c 'cd /packages/snappl/snappl/tests && pytest -v'
          docker compose down -v
          # move the snappl checkout back to where further github
          # actions will expect it.  (TODO: see if there's a way we
          # can tell the workflow that snappl is checked out in
          # $WHATEVER/packages/snappl, not just $WHATEVER/snappl.)
          cd ../../
          mv snappl ../
          cd ..
          pwd
          ls -l
